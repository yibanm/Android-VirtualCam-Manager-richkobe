name: Build Signed APK + Magisk Module

# 触发方式：
#   - push 到 main / 手动 dispatch：构建并上传 artifact（不发 Release）
#   - 本仓库不含公开发布流程（上游无 LICENSE，按用户要求不做公开 Release）
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manager sources (no patch assemble)
        run: |
          test -f manager-app/app/src/main/java/com/virtualcam/manager/ui/screens/FailureDoctorCard.kt
          test -f manager-app/app/src/main/java/com/virtualcam/manager/data/PrerequisiteChecker.kt
          grep -n 'versionName' manager-app/app/build.gradle.kts
          echo "manager sources ready"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: manager-app
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi
          chmod +x gradlew

      # 签名密钥来自仓库 secret（VCAM_KEYSTORE_BASE64 等）。
      # 未配置 secret 时自动跳过签名，产出 unsigned APK 并在日志中明确标注，
      # 避免"看着像正式包实则装不上"的坑（apksigner verify 会拦住）。
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VCAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "WARN: VCAM_KEYSTORE_BASE64 not set - falling back to DEBUG signing (APK still installable)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 不用 heredoc：YAML block scalar 内的缩进会让 heredoc 结束标记无法顶格，
          # 导致 shell 读不到 EOF 而语法错误，故逐行写入。
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.VCAM_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.VCAM_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.VCAM_KEY_PASSWORD }}"
          } > manager-app/keystore.properties
          echo "has_key=true" >> "$GITHUB_OUTPUT"
          echo "signing key prepared"

      - name: Build Debug APK
        working-directory: manager-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        working-directory: manager-app
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 签名校验：现在总会签名（正式密钥或 debug 回退），故无条件校验。
      # 这一步是防止上游那种"artifact 名字像正式包、实则 unsigned"的问题复发。
      - name: Verify release APK signature
        run: |
          APK=$(ls manager-app/app/build/outputs/apk/release/*.apk | head -1)
          echo "Verifying $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" > /dev/null && echo "zipalign OK"

      # 产物按 CLAUDE.md 0.10 命名：软件名-版本-平台.扩展名
      # ABI 段必须从产物内部实测读取，不能照抄模板写死 arm64：
      # 管理 APK 是纯 Kotlin 工程，其 lib/ 下的 .so 全部来自 androidx 依赖，
      # 实际会打进多少个 ABI 由依赖决定（本机实测为 4 个 ABI → universal），
      # 写死 arm64 会让文件名与实际内容不符。
      - name: Rename artifacts per release naming convention
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' manager-app/app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          REL=$(ls manager-app/app/build/outputs/apk/release/*.apk | head -1)
          DBG=$(ls manager-app/app/build/outputs/apk/debug/*.apk | head -1)
          # 从 APK 内部列出 lib/<abi>/ 目录，得到真实支持的 ABI 集合
          ABIS=$(unzip -l "$REL" | grep -oE 'lib/[^/]+/' | sed 's|lib/||;s|/||' | sort -u | paste -sd+ -)
          case "$ABIS" in
            "") ABI=universal ;;
            *+*) ABI=universal ;;
            *) ABI=$ABIS ;;
          esac
          echo "Detected ABI(s): ${ABIS:-none} -> label=$ABI"
          cp "$REL" "dist/virtualcam-manager-${VER}-android-${ABI}.apk"
          cp "$DBG" "dist/virtualcam-manager-${VER}-android-${ABI}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist/
          cat dist/SHA256SUMS.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualcam-manager-release
          path: |
            dist/virtualcam-manager-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-magisk:
    name: Package Magisk Module (+ Zygisk GL v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # r27c：16 KB page size 支持完善，且与本机 NDK 27.0.12077973 同代
          ndk-version: r27c
          add-to-path: true
        continue-on-error: true

      - name: Fetch zygisk.hpp
        run: |
          mkdir -p zygisk-native/jni
          curl -fsSL -o zygisk-native/jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      # ShadowHook 1.0.10 官方仅声明兼容到 Android 15；2.0.0 起兼容 Android 16、
      # 2.0.1 兼容到 Android 17。本仓库目标设备为 Android 16，故必须用 2.x。
      # 升级安全性已逐符号核对：代码用到的 shadowhook_init / hook_sym_name /
      # unhook / get_errno / to_errmsg 在 2.0.1 的 arm64 .so 中均为真实导出符号(T)，
      # 且 shadowhook_init(mode, debuggable) 签名未变、mode=1 仍为 SHADOWHOOK_MODE_UNIQUE。
      - name: Fetch ShadowHook runtime libs
        run: |
          mkdir -p /tmp/sh-aar magisk-module/libs
          VER=2.0.1
          URL="https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/${VER}/shadowhook-${VER}.aar"
          if curl -fsSL -o /tmp/sh-aar/sh.aar "$URL"; then
            cd /tmp/sh-aar && unzip -oq sh.aar
            for ABI in arm64-v8a armeabi-v7a x86_64; do
              if [ -f jni/$ABI/libshadowhook.so ]; then
                mkdir -p $GITHUB_WORKSPACE/magisk-module/libs/$ABI
                cp jni/$ABI/libshadowhook.so $GITHUB_WORKSPACE/magisk-module/libs/$ABI/
                echo "ShadowHook $ABI $(stat -c%s jni/$ABI/libshadowhook.so) bytes"
              fi
            done
            # 断言关键符号真实存在，防止未来 ShadowHook 改符号名导致 dlsym 静默失败。
            # NM 路径直接取 setup-ndk 的 ndk-path 输出：该 action 并不设置
            # ANDROID_NDK_ROOT/ANDROID_NDK_HOME，若靠这两个变量定位会找不到 llvm-nm，
            # 断言将落入 WARN 分支被静默跳过，等于没有断言。
            NDK_DIR="${{ steps.setup-ndk.outputs.ndk-path }}"
            NM=""
            if [ -n "$NDK_DIR" ] && [ -d "$NDK_DIR" ]; then
              NM=$(find "$NDK_DIR" -name 'llvm-nm' -type f 2>/dev/null | head -1)
            fi
            if [ -z "$NM" ]; then
              NM=$(command -v llvm-nm || command -v nm || true)
            fi
            SO=$GITHUB_WORKSPACE/magisk-module/libs/arm64-v8a/libshadowhook.so
            # 分开报两种缺失，避免把「.so 没拷进来」误报成「找不到 llvm-nm」而排错跑偏
            if [ ! -f "$SO" ]; then
              echo "ERROR: $SO missing - ShadowHook $VER AAR did not provide arm64-v8a library"
              exit 1
            fi
            if [ -n "$NM" ]; then
              echo "Using NM=$NM"
              for SYM in shadowhook_init shadowhook_hook_sym_name shadowhook_unhook shadowhook_get_errno shadowhook_to_errmsg; do
                if "$NM" -D --defined-only "$SO" | grep -q " $SYM\$"; then
                  echo "OK symbol: $SYM"
                else
                  echo "ERROR: ShadowHook $VER missing symbol $SYM - dlsym would fail at runtime"
                  exit 1
                fi
              done
            else
              # 断言是本步骤的核心价值，找不到工具就明确失败而不是静默跳过
              echo "ERROR: llvm-nm not found (NDK_DIR='$NDK_DIR') - cannot assert ShadowHook symbols"
              exit 1
            fi
          else
            echo "ERROR: could not download ShadowHook $VER AAR - hooks would silently fail on device"
            exit 1
          fi

      - name: Verify native sources
        run: |
          test -f zygisk-native/jni/main.cpp
          test -f zygisk-native/jni/gl_hooks.cpp
          test -f zygisk-native/jni/gl_hooks.h
          test -f zygisk-native/jni/jni_camera_hooks.cpp
          test -f zygisk-native/jni/jni_camera_hooks.h
          test -f zygisk-native/jni/status_io.h
          grep -n 'install_jni_camera_hooks\|2\.1' zygisk-native/jni/main.cpp
          grep -n 'jni_camera_hooks' zygisk-native/CMakeLists.txt
          echo "native sources verified"

      - name: Build Zygisk native with CMake (GL + MediaCodec)
        if: steps.setup-ndk.outcome == 'success'
        working-directory: zygisk-native
        run: |
          export NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir -p ../magisk-module/zygisk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== Building $ABI ==="
            BUILD_DIR=build-$ABI
            cmake -B $BUILD_DIR \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              || { echo "cmake configure failed for $ABI"; continue; }
            cmake --build $BUILD_DIR -j$(nproc) \
              || { echo "cmake build failed for $ABI"; continue; }
            SO=$(find $BUILD_DIR -name "libvirtualcam.so" | head -1)
            if [ -n "$SO" ] && [ -f "$SO" ]; then
              case $ABI in
                arm64-v8a)   OUT=arm64-v8a.so ;;
                armeabi-v7a) OUT=armeabi-v7a.so ;;
                x86_64)      OUT=x86_64.so ;;
              esac
              cp "$SO" ../magisk-module/zygisk/$OUT
              echo "Packaged $OUT ($(stat -c%s ../magisk-module/zygisk/$OUT) bytes)"
            else
              echo "No libvirtualcam.so for $ABI"
            fi
          done
          ls -la ../magisk-module/zygisk/ || true

      # 断言 arm64 .so 真的产出了，否则模块刷进去不生效却看不出来
      - name: Assert arm64 zygisk binary exists
        run: |
          SO=magisk-module/zygisk/arm64-v8a.so
          if [ ! -f "$SO" ]; then
            echo "ERROR: $SO missing - Magisk module would load nothing on arm64 devices"
            exit 1
          fi
          echo "OK: $SO $(stat -c%s $SO) bytes"

      - name: Package Magisk zip
        run: |
          VER=$(grep -oP '^version=\K.*' magisk-module/module.prop)
          echo "module_version=$VER" >> "$GITHUB_ENV"
          if [ -f magisk-module/libs/arm64-v8a/libshadowhook.so ]; then
            cp magisk-module/libs/arm64-v8a/libshadowhook.so magisk-module/libshadowhook.so
          fi
          cd magisk-module
          zip -r ../VirtualCam-Manager-Magisk-${VER}.zip .
          ls -la ../VirtualCam-Manager-Magisk-${VER}.zip
          unzip -l ../VirtualCam-Manager-Magisk-${VER}.zip | head -40

      - name: Upload Magisk zip
        uses: actions/upload-artifact@v4
        with:
          name: virtualcam-manager-magisk-module
          path: VirtualCam-Manager-Magisk-*.zip
          if-no-files-found: error
